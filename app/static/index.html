<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app.title">漫剧生成系统</title>
    <!-- 主题防闪烁：React 挂载前按「localStorage 覆盖 > 系统偏好」先注入 .dark，
         判定逻辑与 src/context/ThemeContext.tsx 必须保持一致（默认跟随系统）。 -->
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('theme-mode'); } catch (e) { /* 隐私模式等存不了就当没存过 */ }
        var dark = stored === 'dark' ||
          ((stored === 'system' || stored === null) &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <!-- Tailwind 已改为构建期编译（见 tailwind.config.js / postcss.config.js），
         不再运行时拉取 cdn.tailwindcss.com —— 保证断网与离线打包可用。 -->
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      #root { height: 100vh; opacity: 0; transition: opacity 0.3s ease; }
      #root.ready { opacity: 1; }
      /* ⚠️ 与 src/index.css 的 .fade-in 必须保持一致。
         结束帧不能残留 transform，否则会让本元素成为 position:fixed 后代
         的包含块，Modal / Toast 会被定位到屏幕之外。
         fill-mode 用 backwards（不可用 both/forwards）。 */
      .fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) backwards; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; }
      }
      /* 首屏样式：index.css 尚未加载时用，token 由 :root 提供；
         滚动条具体取值与 index.css 的滚动条规则保持一致（深色下 --brand 随
         :root.dark 覆盖层自动切换，无需单独定义变体）。 */
      html.dark { background: #020617; color-scheme: dark; } /* 防闪烁：深色首屏底色，与 :root.dark 的 --bg-canvas 一致 */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgb(var(--brand) / 0.35); border-radius: 3px; }
    </style>
    <script type="module" crossorigin src="/assets/index-668s4jpu.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BwokWKQ5.css">
  </head>
  <body class="bg-canvas text-ink-1">
    <div id="root"></div>
  </body>
</html>
