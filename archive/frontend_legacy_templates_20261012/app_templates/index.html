<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app.title">漫剧工坊 · 全自动AI生产平台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-dark: #0a0e1a;
            --bg-panel: rgba(15, 23, 42, 0.85);
            --bg-card: rgba(30, 41, 59, 0.6);
            --border-glow: rgba(99, 102, 241, 0.3);
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-cyan: #06b6d4;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --glass-blur: blur(20px);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: var(--bg-panel);
            border-radius: 20px;
            border: 1px solid var(--border-glow);
            backdrop-filter: var(--glass-blur);
        }
        
        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .badge {
            display: inline-block;
            padding: 8px 20px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 20px;
            font-size: 0.9em;
        }
        
        .nav-tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .nav-tab {
            padding: 12px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-primary);
            font-size: 1em;
        }
        
        .nav-tab:hover, .nav-tab.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }
        
        .section {
            display: none;
            background: var(--bg-panel);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border-glow);
        }
        
        .section.active {
            display: block;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border-glow);
        }
        
        .stat-card .label {
            color: var(--text-secondary);
            font-size: 0.9em;
        }
        
        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: var(--accent-primary);
            margin-top: 5px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(99,102,241,0.2);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .lang-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .lang-switch select {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
        }
        
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="lang-switch">
        <select id="langSelect" onchange="switchLang(this.value)">
            <option value="zh-CN">简体中文</option>
            <option value="en-US">English</option>
        </select>
    </div>
    
    <div class="container">
        <div class="header">
            <h1 data-i18n="app.title">漫剧工坊 · 全自动AI生产平台</h1>
            <div class="badge" id="statusBadge">TypeScript 重构进行中...</div>
        </div>
        
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showSection('overview')" data-i18n="step.tools">工作台</button>
            <button class="nav-tab" onclick="showSection('projects')" data-i18n="app.project">项目</button>
            <button class="nav-tab" onclick="showSection('memory')" data-i18n="memory.title">AI 记忆</button>
            <button class="nav-tab" onclick="showSection('settings')" data-i18n="settings.title">设置</button>
        </div>
        
        <!-- Overview Section -->
        <div id="overview" class="section active">
            <h2 data-i18n="analytics.title">系统概览</h2>
            <div id="overviewContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p data-i18n="common.loading">加载中...</p>
                </div>
            </div>
        </div>
        
        <!-- Projects Section -->
        <div id="projects" class="section">
            <h2 data-i18n="project.listTitle">项目列表</h2>
            <div id="projectsContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p data-i18n="common.loading">加载中...</p>
                </div>
            </div>
        </div>
        
        <!-- Memory Section -->
        <div id="memory" class="section">
            <h2 data-i18n="memory.title">AI 记忆</h2>
            <div id="memoryContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p data-i18n="common.loading">加载中...</p>
                </div>
            </div>
        </div>
        
        <!-- Settings Section -->
        <div id="settings" class="section">
            <h2 data-i18n="settings.title">设置</h2>
            <div id="settingsContent">
                <p data-i18n="common.developing">功能开发中...</p>
            </div>
        </div>
    </div>
    
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
