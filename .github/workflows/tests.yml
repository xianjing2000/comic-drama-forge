name: Tests

# 测试门禁（2026-10-12 t80）：今晚修的所有回归（cache_name 分场/软超时续等/t2 合并/
# fail-open/统一隔离）此前只靠人跑，无 CI 兜底。本流水线把全量 unittest 接入 push/PR。
#
# 为什么可行（t60 已论证）：测试链路不 import torch/cv2，软超时/cache_name/t2 合并
# 都用 mock/仿真不真连 ComfyUI，依赖生产数据的用例自带 skipUnless。纯 CPU，约 15 秒。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 防挂死：全量实测约 15 秒，15 分钟上限足够富余
    env:
      PYTHONIOENCODING: utf-8
      # 防 import app/autopilot 拉起托管线程（守卫脚本同款环境钉）
      MJSCXT_AUTOPILOT: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pyflakes

      # ⭐ Phase 0（2026-10-16）静态门禁：语法错误 + 未定义名（F821）。
      # 把「等裸名首次触达才炸」的 NameError 类缺陷挡在 PR 之前（实测曾有一例在杀
      # 生产）。范围 app/（含 routes/workers/providers 等子目录）。
      # ⚠️ 首次启用前请在本地跑一次 `python tools/lint_gate.py` 确认无历史遗留问题。
      - name: Static lint (undefined name / syntax)
        run: python tools/lint_gate.py

      # ⭐ D-4（2026-10-16）依赖图门禁：只对**基线之外的新循环依赖**报错。当前库有
      # 5 组已知环（多为函数内惰性 import 的逃逸态），直接「有环即红」会让 CI 恒红 ——
      # 故用基线登记，只防「生长」。基线 tools/dep_cycles_baseline.json，更新需人审后
      # 跑 `python tools/audit_depgraph.py --write-baseline`。
      - name: Dependency graph gate (no new cycles)
        run: python tools/audit_depgraph.py --strict

      - name: Run tests
        run: python tools/run_all_tests.py
